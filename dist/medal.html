<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dom-to-image-more/3.7.1/dom-to-image-more.min.js" integrity="sha512-RJKZcSJwVofSjHvn0T91xO36B8h6XtPShxnAkL86x9cFH1T1lBa6frPwTJAcb/cvUuDGy/Fa//Z7Zqp06kP60w==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://unpkg.com/twemoji@latest/dist/twemoji.min.js" crossorigin="anonymous"></script>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐞🐝</text></svg>">
   
    <style>
    @font-face {
        font-family: '04b_19';
        src: url('./04b19.woff2') format('woff2'),
            url('./04b19.woff') format('woff');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
    }

    body { font-family: '04b_19', monospace; transition: all 0.5s ease-in-out; background: hotpink; color: #fff; }
    body.complete { opacity: 0; }
    .dusk { background: linear-gradient(black, darkblue, cornflowerblue, yellow);}
    h1 { margin-top: 3rem; text-align: center; font-size: 500%; color: #000; 
    text-shadow:
    7px 7px 0 #fff,
    -7px 7px 0 #fff,
    -7px -7px 0 #fff,
    7px -7px 0 #fff
    }
    .bug { color: crimson; }
    .bee { color: orange; }


    .intro {
      display: block; margin: 1rem auto; width: 400px;
      font-size: 2rem;
    }

    .wrap {
      display: block; margin: 1rem auto; width: 400px;
      font-size: 1.5rem; font-family: monospace;
    }

    button { margin-bottom: 1rem; }

    .medal {
      background: linear-gradient(27deg, midnightblue 0%, indigo 50%, midnightblue 100%);
      border-radius: 5px;
      border: 2px solid #000;
      padding: 6px;
      box-sizing: border-box;
      width: 100px; height: 100px;
      display: flex;
      flex-direction: column;
      flex-wrap: nowrap;
      text-align: center;
      margin-bottom: 10px;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
    }
    .medal .emoji { font-size: 48px; margin: 2px 0; }

    .medal .emoji img { width: 48px; height: 48px;
      filter:
        drop-shadow(3px 0 0 black)
        drop-shadow(-3px 0 0 black)
        drop-shadow(0 3px 0 black)
        drop-shadow(0 -3px 0 black);
    }

    .medal .text { color: orange; font-size: 18px;
      text-shadow:
      3px 3px 0 #000,
      -3px 3px 0 #000,
      -3px -3px 0 #000,
      3px -3px 0 #000
    }

    .medal .emoji img svg path {
      stroke: black;
      stroke-width: 4px;
      paint-order: stroke;
    }

    </style>

  </head>
  <body>

    <h1><span class="bug">BuG</span><small>&</small><span class="bee">bEe</span></h1>

    <button id="generateMedals">Generate Medals</button>

    <div class="medal" data-title="buddy">
      <span class="emoji">😎</span>
      <span class="text">buddy</span>
    </div>
    <div class="medal" data-title="achiever">
      <span class="emoji">💸</span>
      <span class="text">achiever</span>
    </div>
    <div class="medal" data-title="power">
      <span class="emoji">⚡</span>
      <span class="text">power</span>
    </div>
    <div class="medal" data-title="spelunker">
      <span class="emoji">🦇</span>
      <span class="text">spelunker</span>
    </div>
    <div class="medal" data-title="spelunker">
      <span class="emoji">🏆</span>
      <span class="text">champ</span>
    </div>


<script>

twemoji.parse(document.body);

document.querySelector('#generateMedals')
  .addEventListener('click', (e) => {
    console.log('CLICK');
    generateMedals();
  }, false);

const generateMedals = () => {

  let medals = document.querySelectorAll('.medal')
  medals.forEach((medal) => {
    let title = medal.querySelector('.text').innerText;
    console.log(title, medal);
    // domtoimage.toPng(medal)
    //     .then(function (dataUrl) {
    //         const img = new Image();
    //         img.src = dataUrl;
    //         img.title = title;
    //         document.body.appendChild(img);
    //     })
    //     .catch(function (error) {
    //         console.error('oops, something went wrong!', error);
    //     });

    domtoimage.toPng(medal, {
      quality: 1,
      style: {
        transform: "scale(2)",
        transformOrigin: "top left"
      },
      width: medal.offsetWidth * 2,
      height: medal.offsetHeight * 2
    })
    .then(dataUrl => {
        const img = new Image();
        img.src = dataUrl;
        img.title = title;
        document.body.appendChild(img);
    });
  });

}

</script>


  </body>
</html>
